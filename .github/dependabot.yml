# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # "/parser" was listed here but contains no go.mod -- the parser package is
  # part of the root module -- so no Go dependency was being updated at all.
  # The example applications are each their own module and drift independently
  # of the root, which is how one of them ended up pinning a golang.org/x/sync
  # version too old to build against a current pgx.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/integrations/**"
      - "/validation-tests/**"
    schedule:
      interval: "weekly"
